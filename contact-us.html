    <div class="container">
      <h1>Contact Us</h1>
      <p>Please fill out the form below with a quick description of your project and we will get back to you as soon as possible.</p>
      <form action="https://formspree.io/f/xkolzppe/"
     method="POST">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required minlength="2">
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
    </div>
